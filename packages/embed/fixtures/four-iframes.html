<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reference: four hosted iframes (cross-site, out of process)</title>
    <script src="/assets/host-probe.js"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
      }
      .frame {
        position: relative;
        width: 100%;
        max-width: 800px;
        aspect-ratio: 16/9;
        overflow: hidden;
        border-radius: 12px;
        margin-bottom: 24px;
      }
      .frame iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <h1>Four hosted iframes</h1>
    <p>
      C5 reference only: these frames come from http://127.0.0.1:4173 (the hosted app under <code>vite preview</code>),
      which is cross-site to this page, so they run out of process. Not equivalent to in-page widgets.
    </p>
    <div class="frame">
      <iframe
        src="http://127.0.0.1:4173/embed#flow=%%FLOW:P3%%"
        title="PLGRND interactive flow"
        loading="lazy"
        sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
        allow="clipboard-write"
      ></iframe>
    </div>
    <div class="frame">
